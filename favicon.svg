<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Neural network nodes in circular pattern -->
  <circle cx="50" cy="15" r="3.5" fill="#282427"/>
  <circle cx="75" cy="25" r="3.5" fill="#282427"/>
  <circle cx="85" cy="50" r="3.5" fill="#282427"/>
  <circle cx="75" cy="75" r="3.5" fill="#282427"/>
  <circle cx="50" cy="85" r="3.5" fill="#282427"/>
  <circle cx="25" cy="75" r="3.5" fill="#282427"/>
  <circle cx="15" cy="50" r="3.5" fill="#282427"/>
  <circle cx="25" cy="25" r="3.5" fill="#282427"/>

  <!-- Center node -->
  <circle cx="50" cy="50" r="5" fill="#282427"/>

  <!-- Neural connections to center -->
  <line x1="50" y1="50" x2="50" y2="15" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
  <line x1="50" y1="50" x2="75" y2="25" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
  <line x1="50" y1="50" x2="85" y2="50" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
  <line x1="50" y1="50" x2="75" y2="75" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
  <line x1="50" y1="50" x2="50" y2="85" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
  <line x1="50" y1="50" x2="25" y2="75" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
  <line x1="50" y1="50" x2="15" y2="50" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
  <line x1="50" y1="50" x2="25" y2="25" stroke="#282427" stroke-width="0.8" opacity="0.4"/>

  <!-- Secondary connections between adjacent nodes -->
  <line x1="50" y1="15" x2="75" y2="25" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
  <line x1="75" y1="25" x2="85" y2="50" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
  <line x1="85" y1="50" x2="75" y2="75" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
  <line x1="75" y1="75" x2="50" y2="85" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
  <line x1="50" y1="85" x2="25" y2="75" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
  <line x1="25" y1="75" x2="15" y2="50" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
  <line x1="15" y1="50" x2="25" y2="25" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
  <line x1="25" y1="25" x2="50" y2="15" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
</svg>

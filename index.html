<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypersimple</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo-container">
                <svg class="logo" width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Neural network nodes in circular pattern -->
                    <circle class="node node-1" cx="50" cy="15" r="3.5" fill="#282427"/>
                    <circle class="node node-2" cx="75" cy="25" r="3.5" fill="#282427"/>
                    <circle class="node node-3" cx="85" cy="50" r="3.5" fill="#282427"/>
                    <circle class="node node-4" cx="75" cy="75" r="3.5" fill="#282427"/>
                    <circle class="node node-5" cx="50" cy="85" r="3.5" fill="#282427"/>
                    <circle class="node node-6" cx="25" cy="75" r="3.5" fill="#282427"/>
                    <circle class="node node-7" cx="15" cy="50" r="3.5" fill="#282427"/>
                    <circle class="node node-8" cx="25" cy="25" r="3.5" fill="#282427"/>

                    <!-- Center node -->
                    <circle class="node-center" cx="50" cy="50" r="5" fill="#282427"/>

                    <!-- Neural connections to center -->
                    <line class="connection" x1="50" y1="50" x2="50" y2="15" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
                    <line class="connection" x1="50" y1="50" x2="75" y2="25" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
                    <line class="connection" x1="50" y1="50" x2="85" y2="50" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
                    <line class="connection" x1="50" y1="50" x2="75" y2="75" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
                    <line class="connection" x1="50" y1="50" x2="50" y2="85" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
                    <line class="connection" x1="50" y1="50" x2="25" y2="75" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
                    <line class="connection" x1="50" y1="50" x2="15" y2="50" stroke="#282427" stroke-width="0.8" opacity="0.4"/>
                    <line class="connection" x1="50" y1="50" x2="25" y2="25" stroke="#282427" stroke-width="0.8" opacity="0.4"/>

                    <!-- Secondary connections between adjacent nodes -->
                    <line class="connection" x1="50" y1="15" x2="75" y2="25" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
                    <line class="connection" x1="75" y1="25" x2="85" y2="50" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
                    <line class="connection" x1="85" y1="50" x2="75" y2="75" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
                    <line class="connection" x1="75" y1="75" x2="50" y2="85" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
                    <line class="connection" x1="50" y1="85" x2="25" y2="75" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
                    <line class="connection" x1="25" y1="75" x2="15" y2="50" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
                    <line class="connection" x1="15" y1="50" x2="25" y2="25" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
                    <line class="connection" x1="25" y1="25" x2="50" y2="15" stroke="#282427" stroke-width="0.6" opacity="0.2"/>
                </svg>
            </div>
            <span class="brand-name">Hyper Simple</span>
        </div>
        <a href="mailto:join@hypersimple.ai" class="header-join">Join us</a>
    </header>

    <main class="main">
        <h1 class="tagline">AI for financial markets</h1>
        <p class="description">Founded by scientists, engineers and designers working at the intersection of finance and artificial intelligence</p>
    </main>

    <footer class="footer">
        <p>Hyper Simple 2025</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypersimple</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo-container">
                <svg class="logo" width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Outer ring nodes -->
                    <circle class="node" cx="50" cy="15" r="2.5" fill="#282427" opacity="0.7"/>
                    <circle class="node" cx="75" cy="25" r="2.5" fill="#282427" opacity="0.6"/>
                    <circle class="node" cx="85" cy="50" r="2.5" fill="#282427" opacity="0.7"/>
                    <circle class="node" cx="75" cy="75" r="2.5" fill="#282427" opacity="0.6"/>
                    <circle class="node" cx="50" cy="85" r="2.5" fill="#282427" opacity="0.7"/>
                    <circle class="node" cx="25" cy="75" r="2.5" fill="#282427" opacity="0.6"/>
                    <circle class="node" cx="15" cy="50" r="2.5" fill="#282427" opacity="0.7"/>
                    <circle class="node" cx="25" cy="25" r="2.5" fill="#282427" opacity="0.6"/>

                    <!-- Inner nodes -->
                    <circle class="node" cx="50" cy="38" r="2" fill="#282427" opacity="0.5"/>
                    <circle class="node" cx="62" cy="50" r="2" fill="#282427" opacity="0.5"/>
                    <circle class="node" cx="50" cy="62" r="2" fill="#282427" opacity="0.5"/>
                    <circle class="node" cx="38" cy="50" r="2" fill="#282427" opacity="0.5"/>

                    <!-- Center -->
                    <circle class="node" cx="50" cy="50" r="2.5" fill="#282427" opacity="0.8"/>
                </svg>
            </div>
            <span class="brand-name">Hyper Simple</span>
        </div>
        <a href="mailto:join@hypersimple.ai" class="header-join">Join us</a>
    </header>

    <main class="main">
        <h1 class="tagline">AI for financial markets</h1>
        <p class="description">Founded by scientists, engineers and designers working at the intersection of finance and artificial intelligence</p>
    </main>

    <footer class="footer">
        <p>Hyper Simple 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
